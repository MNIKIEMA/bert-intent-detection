[project]
name = "bert-intent-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "colorlog>=6.9.0",
    "jupyterlab>=4.3.5",
    "matplotlib>=3.10.0",
    "numpy~=1.26.0",
    "pandas>=2.2.3",
    "transformers>=4.49.0",
    "torch>=2.4.1",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
